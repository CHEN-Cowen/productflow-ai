<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProductFlow AI · 商品内容工作台</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f1f2f5; --surface-3:#fafafa;
  --text:#1d2129; --text-2:#5c6470; --text-3:#9aa1ac;
  --brand:#5a5fd6; --brand-2:#6f74e8; --brand-weak:#eeedfb; --brand-strong:#474bc4;
  --success:#16a34a; --success-weak:#e8f7ee;
  --info:#2563eb; --info-weak:#e9f1ff;
  --warning:#d97706; --warning-weak:#fdf3e2;
  --danger:#dc2626; --danger-weak:#fdeaea;
  --muted:#8a919c; --muted-weak:#f1f2f5;
  --line:#e7e8ec; --line-2:#eef0f3;
  --shadow:0 1px 2px rgba(20,24,33,.04),0 4px 16px rgba(20,24,33,.05);
  --shadow-lg:0 8px 30px rgba(20,24,33,.12);
  --r-sm:8px; --r:10px; --r-lg:14px;
  --sidebar-w:256px; --header-h:60px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d6dc;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b9bec7;background-clip:content-box}

/* ============ 布局 ============ */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--header-h) 1fr;height:100vh;grid-template-areas:"side head" "side main"}
.side{grid-area:side;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.head{grid-area:head;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:20}
.main{grid-area:main;overflow:auto;position:relative}
.view{max-width:1240px;margin:0 auto;padding:28px 32px 64px}

/* ============ 侧边栏 ============ */
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 16px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.brand b{font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--text-3);font-size:11px;font-weight:400;margin-top:-1px}
.nav-scroll{flex:1;overflow:auto;padding:4px 12px 16px}
.nav-group{margin-top:8px}
.nav-group>.cap{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase}
.nav-group>.cap .ic{width:15px;height:15px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--text-2);font-size:13.5px;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item .ic{width:17px;height:17px;flex:none;opacity:.85}
.nav-item.on{background:var(--brand-weak);color:var(--brand-strong);font-weight:600}
.nav-item.on .ic{opacity:1}
.nav-item .pin{margin-left:auto;font-size:10px;color:var(--brand);background:#fff;border:1px solid var(--brand);border-radius:20px;padding:1px 7px}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.side-foot .ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#c7cbf5,#9aa0e8);color:#3d3f8f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.side-foot .who{font-size:13px;font-weight:600}
.side-foot .role{font-size:11px;color:var(--text-3)}
.side-foot .spacer{flex:1}

/* ============ 顶栏 ============ */
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:13px;white-space:nowrap}
.crumb .sep{opacity:.5}
.crumb b{color:var(--text);font-weight:600}
.head .spacer{flex:1}
.head .ctx{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text-2)}
.head .ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.icon-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;transition:background .12s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .ic{width:19px;height:19px}
.icon-btn .badge{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 11px;width:220px}
.searchbox .ic{width:16px;height:16px;color:var(--text-3)}
.searchbox input{border:none;background:none;outline:none;width:100%;font-size:13px}

/* ============ 通用组件 ============ */
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.page-head{margin-bottom:20px}
.page-head .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .desc{color:var(--text-2);margin-top:6px;max-width:760px;font-size:13.5px}
.page-head .actions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lead{margin-top:14px;color:var(--text-3);font-size:12px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:background .12s,box-shadow .12s,transform .04s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-strong)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-soft{background:var(--brand-weak);color:var(--brand-strong)}
.btn-soft:hover{background:#e2e0f9}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:12px;border-radius:7px;font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.input,select.input,textarea.input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:border .12s,box-shadow .12s}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
textarea.input{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field>label .req{color:var(--danger)}
.field .hint{font-size:12px;color:var(--text-3);margin-top:5px}
.row{display:flex;gap:12px}
.row>*{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.pad{padding:20px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{color:var(--text-3);font-size:12.5px}
.card-h .actions{margin-left:auto;display:flex;gap:8px}
.card-b{padding:20px}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.stat .lbl .ic{width:15px;height:15px}
.stat .num{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px}
.stat .sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.stat.clickable{cursor:pointer;transition:border .12s,box-shadow .12s}
.stat.clickable:hover{border-color:var(--brand);box-shadow:var(--shadow-lg)}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.gray{background:var(--muted-weak);color:#6b7280}
.tag.blue{background:var(--info-weak);color:var(--info)}
.tag.green{background:var(--success-weak);color:var(--success)}
.tag.orange{background:var(--warning-weak);color:var(--warning)}
.tag.red{background:var(--danger-weak);color:var(--danger)}
.tag.purple{background:var(--brand-weak);color:var(--brand-strong)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:11px 14px;color:var(--text-3);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-3)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl .act{display:flex;gap:6px}

/* 商品单元格 */
.cell-prod{display:flex;align-items:center;gap:11px}
.thumb{width:42px;height:42px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.thumb .ic{width:22px;height:22px;opacity:.95}
.cell-prod .nm{font-weight:600}
.cell-prod .cd{font-size:12px;color:var(--text-3)}

/* 筛选栏 */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters .input,.filters select.input{width:auto;min-width:150px}
.filters .spacer{flex:1}

/* 进度条 */
.progress{height:7px;background:var(--surface-2);border-radius:20px;overflow:hidden;min-width:80px}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:20px;transition:width .4s}
.progress.blue>i{background:var(--info)}
.progress.green>i{background:var(--success)}
.progress.orange>i{background:var(--warning)}

/* 分页 */
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:16px;color:var(--text-2);font-size:13px}
.pager button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.pager button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pager button[disabled]{opacity:.4;cursor:not-allowed}

/* 步骤条 */
.stepper{display:flex;align-items:center;gap:0;margin:6px 0 22px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text-3);flex:none;background:#fff}
.step .txt{font-size:12.5px;color:var(--text-3);font-weight:600}
.step .txt small{display:block;font-weight:400;color:var(--text-3);font-size:11px}
.step.on .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.step.on .txt{color:var(--text)}
.step.done .dot{background:var(--success-weak);border-color:var(--success);color:var(--success)}
.step .line{flex:1;height:2px;background:var(--line);margin:0 10px}
.step:last-child .line{display:none}

/* 选项卡 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand-strong);border-bottom-color:var(--brand)}

/* 上传区 */
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:32px;text-align:center;color:var(--text-2);cursor:pointer;transition:border .12s,background .12s;background:var(--surface-3)}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:var(--brand-weak)}
.dropzone .ic{width:34px;height:34px;color:var(--brand);margin-bottom:8px}

/* 文件列表 */
.filelist{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.file .fic{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.file .fic .ic{width:18px;height:18px}
.file .meta{flex:1;min-width:0}
.file .meta b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .meta span{font-size:12px;color:var(--text-3)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(20,24,33,.4);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;z-index:100;animation:fade .15s}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;max-height:calc(100vh - 96px);overflow:auto;animation:pop .18s}
.modal.lg{max-width:900px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:2}
.modal-h h3{font-size:16px;font-weight:700;flex:1}
.modal-b{padding:22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:#fff}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:#1d2129;color:#fff;padding:11px 17px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);animation:pop .2s;max-width:480px}
.toast .ic{width:17px;height:17px;flex:none}
.toast.success .ic{color:#4ade80}
.toast.error .ic{color:#f87171}
.toast.info .ic{color:#93c5fd}

/* 空状态 */
.empty{text-align:center;padding:52px 20px;color:var(--text-2)}
.empty .art{width:64px;height:64px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--text-3)}
.empty .art .ic{width:30px;height:30px}
.empty h4{font-size:15px;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;color:var(--text-2);max-width:420px;margin:0 auto 16px}
.empty .actions{display:flex;gap:10px;justify-content:center}

/* 提示条 */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.alert .ic{width:17px;height:17px;flex:none;margin-top:1px}
.alert.info{background:var(--info-weak);color:#1e40af}
.alert.warn{background:var(--warning-weak);color:#92400e}
.alert.error{background:var(--danger-weak);color:#991b1b}
.alert.success{background:var(--success-weak);color:#166534}
.alert .x{margin-left:auto;cursor:pointer;opacity:.6}
.alert .x:hover{opacity:1}

/* 三栏工作区（数据清洗） */
.threecol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.threecol .pane{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;display:flex;flex-direction:column;min-height:520px;overflow:hidden}
.pane-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;background:var(--surface-3)}
.pane-h .ic{width:16px;height:16px;color:var(--brand)}
.pane-h b{font-size:13.5px}
.pane-h .cap{font-size:11px;color:var(--text-3);margin-left:auto}
.pane-b{padding:14px;overflow:auto;flex:1}

/* 字段对照 */
.map-row{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--surface-3)}
.map-row .k{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.map-row .v{font-size:13.5px;font-weight:600;margin-top:3px}
.map-row .v .tag{margin-left:6px;vertical-align:middle}
.map-row .evi{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:5px;cursor:pointer}
.map-row .evi:hover{color:var(--brand)}

/* 卖点卡片 */
.sp-card{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:#fff;margin-bottom:12px;transition:border .12s,box-shadow .12s}
.sp-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.sp-card .top{display:flex;align-items:flex-start;gap:10px}
.sp-card .top .grip{margin-top:3px;color:var(--text-3);cursor:grab}
.sp-card h4{font-size:14.5px;font-weight:700}
.sp-card .basis{font-size:12px;color:var(--text-2);margin-top:3px}
.sp-card .bottom{display:flex;align-items:center;gap:8px;margin-top:12px}

/* 创意方案卡 */
.concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.concept{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden;display:flex;flex-direction:column;transition:border .12s,box-shadow .12s}
.concept:hover{box-shadow:var(--shadow)}
.concept.selected{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
.concept .cv{height:120px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:#fff}
.concept .cv .ic{width:34px;height:34px}
.concept .cb{padding:15px;flex:1;display:flex;flex-direction:column}
.concept .cb h4{font-size:14.5px;font-weight:700}
.concept .cb .pos{font-size:12px;color:var(--brand);font-weight:600;margin-top:2px}
.concept .cb p{font-size:12.5px;color:var(--text-2);margin-top:6px}
.concept .cb .meta{margin-top:10px;font-size:11.5px;color:var(--text-3)}
.concept .cf{padding:12px 15px;border-top:1px solid var(--line-2);display:flex;gap:8px}

/* 图片策划卡 */
.imgplan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.imgcard{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.imgcard .iv{height:130px;background:var(--surface-2);position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
.imgcard .iv .num{position:absolute;top:10px;left:10px;background:rgba(20,24,33,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.imgcard .iv .ic{width:32px;height:32px}
.imgcard .ib{padding:13px}
.imgcard .ib h4{font-size:13.5px;font-weight:700}
.imgcard .ib p{font-size:12px;color:var(--text-2);margin-top:4px}
.imgcard .ib .spec{margin-top:9px;font-size:11.5px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:4px}
.imgcard .ib .spec span{background:var(--surface-2);padding:2px 7px;border-radius:6px}
.imgcard .if{padding:10px 13px;border-top:1px solid var(--line-2);display:flex;gap:7px}

/* 视频分镜 */
.video-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.video-meta .vm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 15px;min-width:130px}
.video-meta .vm .l{font-size:11.5px;color:var(--text-3)}
.video-meta .vm .v{font-size:15px;font-weight:700;margin-top:2px}
.timeline{display:flex;height:38px;border-radius:8px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.timeline .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden}
.shot{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;margin-bottom:12px;overflow:hidden}
.shot-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);background:var(--surface-3)}
.shot-h .idx{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.shot-h .dur{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.shot-h .spacer{flex:1}
.shot-b{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot-b .col{display:flex;flex-direction:column;gap:9px}
.shot-b .kv{font-size:12.5px}
.shot-b .kv b{display:block;font-size:11.5px;color:var(--text-3);font-weight:600;margin-bottom:2px}

/* 版本对比 */
.diff-table{width:100%;border-collapse:collapse;font-size:13px}
.diff-table th,.diff-table td{padding:9px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.diff-table th{color:var(--text-3);font-size:12px;font-weight:600}
.diff-table .del{color:var(--danger);text-decoration:line-through;background:var(--danger-weak)}
.diff-table .add{color:var(--success);background:var(--success-weak)}

/* 分组属性 */
.attr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.attr-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.attr-group h4{font-size:13px;font-weight:700;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.attr-group h4 .ic{width:15px;height:15px;color:var(--brand)}
.attr-group .av{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.attr-group .av:last-child{border-bottom:none}
.attr-group .av .k{color:var(--text-2);flex:none}
.attr-group .av .val{font-weight:500;text-align:right}
.attr-group .av .src{font-size:11px;color:var(--brand);cursor:pointer;margin-top:1px}
.attr-group .av .src:hover{text-decoration:underline}

/* 关联信息条 */
.chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chain .node{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
.chain .node .ic{width:15px;height:15px;color:var(--brand)}
.chain .arr{color:var(--text-3)}

/* 徽标 */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2)}

/* 两栏 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.mt{margin-top:16px}.mb{margin-bottom:16px}.flex{display:flex}.aic{align-items:center}.gap8{gap:8px}.gap12{gap:12px}.muted{color:var(--text-3)}.small{font-size:12px}.bold{font-weight:600}

/* 商品详情头部 */
.pd-hero{display:flex;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.pd-hero .img{width:130px;height:130px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.pd-hero .img .ic{width:54px;height:54px}
.pd-hero .info{flex:1}
.pd-hero .info h2{font-size:19px;font-weight:700}
.pd-hero .info .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--text-2);font-size:13px}
.pd-hero .info .meta span{display:inline-flex;align-items:center;gap:5px}
.pd-hero .info .tags{display:flex;gap:8px;margin-top:12px}
.pd-hero .side{display:flex;flex-direction:column;gap:9px;align-items:flex-end}

/* 响应式 */
@media (max-width:1080px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .attr-grid{grid-template-columns:repeat(2,1fr)}
  .threecol{grid-template-columns:1fr}
  .concepts,.imgplan-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:var(--header-h) 1fr;grid-template-areas:"head" "main"}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);transform:translateX(-100%);transition:transform .2s;z-index:50}
  .side.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .menu-toggle{display:flex!important}
  .searchbox{display:none}
  .ctx{display:none}
  .view{padding:20px 16px 56px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .attr-grid,.concepts,.imgplan-grid,.grid-2,.grid-2-1,.shot-b{grid-template-columns:1fr}
  .pd-hero{flex-direction:column}
}
.menu-toggle{display:none}
</style>

let DB;
function loadDB(){try{const raw=localStorage.getItem(LS_KEY);if(raw){DB=JSON.parse(raw);return;}}catch(e){}DB=seedData();saveDB();}
function saveDB(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}
function resetData(){if(confirm('确认恢复演示数据？当前所有本地修改将被重置为初始示例。')){DB=seedData();saveDB();toast('已恢复演示数据','success');render();}}

/* ================= 路由 & 状态 ================= */
let state={page:'data',productId:null,planId:null,sub:'overview'};
function navigate(hash){location.hash=hash;}
function parseRoute(){
  const h=(location.hash||'#/data/overview').replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  state={center:parts[0]||'data',sub:null,productId:null,planId:null};
  if(state.center==='data'){
    const known=['overview','product','imports','cleaning','quality','versions'];
    state.sub=known.includes(parts[1])?parts[1]:'overview';
    state.productId=parts[2]||null;
  }else{
    if(parts[1]==='list'){state.sub='list';}
    else if(parts[1]==='new'){state.sub='new';}
    else if(parts[1]){state.planId=parts[1];state.sub=parts[2]||'insight';}
    else {state.sub='list';}
  }
}
function go(h){navigate('#/'+h);}

/* ================= 通用渲染辅助 ================= */
const STATUS_TAG={confirmed:'green',pending:'orange',draft:'gray',exception:'red'};
function statusTag(s,label){
  const map={confirmed:['green','已确认'],pending:['orange','待审核'],draft:['gray','草稿'],exception:['red','异常'],
    done:['green','已完成'],cleaning:['blue','清洗中'],parsing:['blue','解析中'],awaiting:['orange','待审核'],failed:['red','失败'],
    review:['orange','待审核'],confirmed:['green','已确认'],archived:['gray','已归档'],running:['blue','进行中']};
  const m=map[s]||['gray',s];
  return '<span class="tag '+m[0]+' dot">'+esc(label||m[1])+'</span>';
}
function productById(id){return DB.products.find(p=>p.id===id);}
function planById(id){return DB.plans.find(p=>p.id===id);}
function productThumb(p,size){
  size=size||42;
  return '<span class="thumb" style="width:'+size+'px;height:'+size+'px;background:linear-gradient(135deg,'+p.color+','+shade(p.color)+')">'+ic(p.icon,Math.round(size*0.52))+'</span>';
}
function shade(hex){const n=parseInt(hex.slice(1),16);const r=Math.min(255,(n>>16)+26),g=Math.min(255,((n>>8)&255)+26),b=Math.min(255,(n&255)+26);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function statsCount(fn){return DB.products.filter(fn).length;}

function navRoute(center,sub){
  if(center==='data'){
    if(sub==='product'){return 'data/product/'+(state.productId||(DB.products[0]&&DB.products[0].id)||'BP01');}
    return 'data/'+sub;
  }
  if(sub==='list')return 'plans/list';
  if(sub==='new')return 'plans/new';
  // 详情页需要 planId
  const pid=state.planId||(DB.plans[0]&&DB.plans[0].id);
  return pid?('plans/'+pid+'/'+sub):'plans/list';
}
function renderNav(){
  const el=document.getElementById('navScroll');
  el.innerHTML=NAV.map(g=>{
    const cap='<div class="cap">'+ic(g.icon,15)+'<span>'+esc(g.title)+'</span></div>';
    const items=g.children.map(c=>{
      let on=false;
      if(g.center==='data'){on=state.center==='data'&&state.sub===c.sub;}
      else {
        if(c.sub==='list')on=state.center==='plans'&&state.sub==='list';
        else if(c.sub==='new')on=state.center==='plans'&&state.sub==='new';
        else on=state.center==='plans'&&state.sub===c.sub&&!!state.planId;
      }
      let badge='';
      if(g.center==='data'&&c.sub==='quality'){const n=DB.issues.filter(i=>i.status==='pending').length;if(n)badge='<span class="pin">'+n+'</span>';}
      if(g.center==='plans'&&c.sub==='list'){const n=DB.plans.filter(p=>p.status==='review').length;if(n)badge='<span class="pin">'+n+'</span>';}
      return '<button class="nav-item'+(on?' on':'')+'" onclick="go(\''+navRoute(g.center,c.sub)+'\')">'+ic(c.icon,17)+'<span>'+esc(c.label)+'</span>'+badge+'</button>';
    }).join('');
    return '<div class="nav-group">'+cap+items+'</div>';
  }).join('');
}

  q=q.trim().toLowerCase();
  const prod=DB.products.find(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q));
  const plan=DB.plans.find(p=>p.name.toLowerCase().includes(q));
  if(prod){go('data/product/'+prod.id);}
  else if(plan){go('plans/'+plan.id+'/insight');}
  else toast('未找到匹配的「'+q+'」','info');
}

function pendingTasksList(){
  const items=[];
  const conflicts=DB.issues.filter(i=>i.status==='pending'&&i.type==='conflict').length;
  const missing=DB.issues.filter(i=>i.status==='pending'&&i.type==='missing').length;
  const unclear=DB.issues.filter(i=>i.status==='pending'&&i.type==='unclear').length;
  const running=DB.imports.filter(t=>['parsing','extracting','cleaning','queued'].includes(t.status)).length;
  const rows=[
    {t:'待处理数据冲突',n:conflicts,on:"go('data/quality')",icon:'alert',color:'var(--danger)'},
    {t:'待补充商品属性',n:missing,on:"go('data/quality')",icon:'edit',color:'var(--warning)'},
    {t:'待审核商品档案',n:statsCount(p=>p.status==='pending'),on:"go('data/quality')",icon:'clock',color:'var(--warning)'},
    {t:'正在进行的资料解析',n:running,on:"go('data/imports')",icon:'workflow',color:'var(--info)'}
  ];
  if(rows.every(r=>r.n===0))return '<div class="small muted">当前没有待处理任务。</div>';
  return rows.filter(r=>r.n>0).map(r=>`<div class="file" style="cursor:pointer" onclick="${r.on}"><span class="fic" style="color:${r.color}">${ic(r.icon)}</span><div class="meta"><b>${r.t}</b></div><span class="tag ${r.n>0&&r.t.includes('冲突')?'red':''}" style="background:${r.color==='var(--danger)'?'var(--danger-weak)':'var(--surface-2)'};color:${r.color}">${r.n}</span></div>`).join('');
}

function saveNewProduct(){
  const name=document.getElementById('npName').value.trim();
  const code=document.getElementById('npCode').value.trim();
  if(!name||!code){toast('请填写商品名称与编码','error');return;}
  if(DB.products.some(p=>p.code===code)){toast('商品编码 '+code+' 已存在','error');return;}
  const cat=document.getElementById('npCat').value;
  const colors={箱包:'#5a5fd6',服饰:'#d96a8b',鞋靴:'#2f7d6d',美妆个护:'#b5792f'};
  const icons={箱包:'bag',服饰:'shirt',鞋靴:'shoe',美妆个护:'jar'};
  DB.products.push({
    id:code,name,code,category:cat,brand:document.getElementById('npBrand').value||'KELIN·客邻',status:'draft',statusNote:'草稿',currentVersion:1,
    color:colors[cat]||'#5a5fd6',icon:icons[cat]||'box',desc:document.getElementById('npDesc').value||'待补充',
    groups:[{title:'基础信息',icon:'box',fields:[['商品名称',name],['商品编码',code],['品类',cat],['商品描述',document.getElementById('npDesc').value||'待补充'],['商品状态','待完善']]}],
    skus:[],sources:[],versions:[{v:1,time:now(),by:'林运营',note:'手动创建草稿',status:'草稿',changes:[{f:'商品创建',before:'—',after:name,reason:'手动新增'}]}]
  });
  saveDB();closeModal();toast('已创建草稿商品 '+code,'success');go('data/product/'+code);
}

function editProduct(id){
  const p=productById(id);
  openModal(`<div class="modal-h"><h3>编辑商品档案</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b">

      <div class="alert info">${ic('info')}<span>编辑将生成新的待审核版本，不覆盖已发布版本（演示逻辑）。</span></div>
    </div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveEditProduct('${id}')">保存修改</button></div>`);

function saveEditProduct(id){
  const p=productById(id);
  const name=document.getElementById('epName').value.trim();
  const desc=document.getElementById('epDesc').value.trim();
  if(!name){toast('商品名称不能为空','error');return;}
  const oldName=p.name,oldDesc=p.desc;
  p.name=name;p.desc=desc;p.status='pending';p.statusNote='待审核';
  p.currentVersion+=1;
  p.versions.push({v:p.currentVersion,time:now(),by:'林运营',note:'编辑商品档案',status:'待审核',changes:[{f:'商品名称',before:oldName,after:name,reason:'人工编辑'},{f:'商品描述',before:oldDesc,after:desc,reason:'人工编辑'}]});
  saveDB();closeModal();toast('已保存，生成待审核版本 V'+p.currentVersion,'success');render();
}

function saveSku(id){
  const p=productById(id);

  const p=productById(id);const s=p.skus.find(x=>x.code===code);if(!s)return;

function publishVersion(productId){
  const p=productById(productId);
  const pend=p.status==='pending';
  const unresolved=DB.issues.filter(i=>i.productId===productId&&i.status==='pending'&&i.sev==='high').length;
  if(unresolved>0){toast('存在 '+unresolved+' 个高严重度未处理问题，需先完成审核','error');go('data/quality');return;}
  if(p.skus.length===0){toast('请先为商品添加 SKU','error');return;}
  const v=p.currentVersion+1;
  p.currentVersion=v;
  p.status='confirmed';p.statusNote='已确认';
  p.versions.push({v,time:now(),by:'林运营',note:'确认发布商品档案',status:'已发布',changes:[{f:'数据状态',before:pend?'待审核':'已确认',after:'已确认',reason:'人工确认发布'}]});

}

function handleImportFiles(files){
  for(const f of files){importWizard.files.push({name:f.name,type:typeFromName(f.name),size:fmtSize(f.size)});}
  renderImportWizard();
}
function typeFromName(n){const e=n.split('.').pop().toLowerCase();if(['xls','xlsx','csv'].includes(e))return 'excel';if(e==='pdf')return 'pdf';if(['doc','docx'].includes(e))return 'word';if(['png','jpg','jpeg','webp'].includes(e))return 'image';return 'doc';}
function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';}
function addMockFiles(){
  const samples=[{name:'商品规格表.xlsx',type:'excel',size:'42 KB'},{name:'商品详情页.pdf',type:'pdf',size:'1.8 MB'},{name:'正面视角.png',type:'image',size:'2.4 MB'}];
  samples.forEach((s,i)=>importWizard.files.push({name:s.name.replace('商品',importWizard.productId||'BP02'),type:s.type,size:s.size}));
  renderImportWizard();
}
function createImportTask(){
  let pid=importWizard.productId;
  if(importWizard.mode==='new'){
    const name=importWizard.newProduct.name||'新商品';const code=importWizard.newProduct.code||uid('P');
    if(!importWizard.newProduct.name||!importWizard.newProduct.code){toast('请填写新商品名称与编码','error');importWizard.step=1;renderImportWizard();return;}
    pid=code;
    const colors={箱包:'#5a5fd6',服饰:'#d96a8b',鞋靴:'#2f7d6d',美妆个护:'#b5792f'};const icons={箱包:'bag',服饰:'shirt',鞋靴:'shoe',美妆个护:'jar'};
    DB.products.push({id:code,name,code,category:importWizard.newProduct.cat,brand:'KELIN·客邻',status:'draft',statusNote:'草稿',currentVersion:1,color:colors[importWizard.newProduct.cat],icon:icons[importWizard.newProduct.cat],desc:'待提取',groups:[{title:'基础信息',icon:'box',fields:[['商品名称',name],['商品编码',code],['品类',importWizard.newProduct.cat],['商品状态','待提取']]}],skus:[],sources:importWizard.files.map(f=>({id:uid('src'),name:f.name,type:f.type,size:f.size,status:'parsed',angle:'正面',time:now()})),versions:[{v:1,time:now(),by:'系统导入',note:'初始提取',status:'待审核',changes:[]}]});
  }
  const task={id:uid('IMP'),name:(importWizard.mode==='existing'?pid:'新商品 '+pid)+' 资料导入',productId:pid,files:importWizard.files.length,time:now(),status:'queued',progress:0,steps:['解析','提取','清洗','审核','完成']};
  DB.imports.unshift(task);
  saveDB();closeModal();toast('导入任务已创建','success');
  // 模拟任务进度
  simulateImportProgress(task.id);
  go('data/imports');
}
function simulateImportProgress(taskId){
  const seq=[['parsing',12],['parsing',36],['extracting',55],['cleaning',78],['cleaning',92],['awaiting',100]];
  let i=0;
  const iv=setInterval(()=>{
    const t=DB.imports.find(x=>x.id===taskId);if(!t){clearInterval(iv);return;}
    if(i>=seq.length){clearInterval(iv);return;}
    t.status=seq[i][0];t.progress=seq[i][1];saveDB();
    if(state.center==='data'&&state.sub==='imports')render();
    i++;
  },450);
}

function qualityHandle(id){
  const i=DB.issues.find(x=>x.id===id);if(!i)return;

}
function conflictModal(i){
  openModal(`<div class="modal-h"><h3>数据冲突审核</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b">
      <div class="alert warn">${ic('alert')}<span>字段「${esc(i.field)}」存在来源冲突，请人工确认最终值。</span></div>
      <table class="tbl"><thead><tr><th>来源</th><th>文件位置</th><th>原始值</th></tr></thead><tbody>
      ${i.sources.map(s=>'<tr><td class="bold">'+esc(s.name)+'</td><td class="small muted">'+esc(s.loc)+'</td><td class="bold">'+esc(s.value)+'</td></tr>').join('')}</tbody></table>
      <div class="mt" style="background:var(--surface-2);border-radius:10px;padding:12px 14px">
        <div class="bold small">AI 冲突判断</div><div class="small mt" style="margin-top:4px">${esc(i.aiJudge)}</div>
        <div class="bold small mt" style="margin-top:10px">AI 建议</div><div class="small" style="margin-top:4px;color:var(--brand)">建议采用：${esc(i.suggestion)}</div>
      </div>
      <div class="field mt"><label>选择处理方式</label>
        ${i.sources.map((s,idx)=>'<label class="file" style="margin-bottom:8px;cursor:pointer"><input type="radio" name="conflictSel" value="'+esc(s.value)+'" '+(idx===0?'checked':'')+'> <span class="meta"><b>采用来源 '+(idx===0?'A':'B')+'：'+esc(s.value)+'</b><span>'+esc(s.name)+'</span></span></label>').join('')}
        <label class="file" style="margin-bottom:8px;cursor:pointer"><input type="radio" name="conflictSel" value="manual"> <span class="meta"><b>手动输入正确值</b></span></label>
      </div>
      <div class="field" id="manualWrap" style="display:none"><label>手动输入值</label><input class="input" id="manualVal" placeholder="输入正确值"></div>
    </div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">暂不处理</button><button class="btn btn-primary" onclick="resolveConflict('${i.id}')">${ic('check')}确认处理</button></div>`);
  document.querySelectorAll('input[name="conflictSel"]').forEach(r=>r.addEventListener('change',e=>{document.getElementById('manualWrap').style.display=e.target.value==='manual'?'block':'none';}));
}
function resolveConflict(id){
  const i=DB.issues.find(x=>x.id===id);
  const sel=document.querySelector('input[name="conflictSel"]:checked');
  let final=sel.value;
  if(final==='manual'){final=document.getElementById('manualVal').value.trim();if(!final){toast('请输入手动值','error');return;}}
  i.status='resolved';i.finalValue=final;i.reviewer='林运营';i.reviewedAt=now();i.basis=sel.value==='manual'?'人工录入':'来源 '+sel.value;
  saveDB();closeModal();toast('冲突已处理，记录最终值：'+final,'success');render();
}
function simpleIssueModal(i){
  const TYPE={missing:'信息缺失',unclear:'来源不明确',format:'格式错误',duplicate:'重复商品'};
  openModal(`<div class="modal-h"><h3>处理问题：${TYPE[i.type]||i.type}</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b">
      <div class="alert info">${ic('info')}<span>${esc(i.desc)}</span></div>
      <div class="field"><label>${i.type==='missing'?'补充值（可选补充资料）':i.type==='format'?'标准值':i.type==='unclear'?'关联来源':'处理方式'}</label>
      <input class="input" id="siVal" value="${esc(i.suggestion||'')}" placeholder="${i.type==='unclear'?'重新关联来源说明':'输入值'}"></div>
      <label class="file" style="cursor:pointer"><input type="checkbox" id="siNeedMore"> <span class="meta"><b>标记为需补充资料</b></span></label>
    </div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">暂不处理</button><button class="btn btn-primary" onclick="resolveSimple('${i.id}')">${ic('check')}确认</button></div>`);
}
function resolveSimple(id){
  const i=DB.issues.find(x=>x.id===id);
  const needMore=document.getElementById('siNeedMore').checked;
  const val=document.getElementById('siVal').value.trim();
  if(needMore){i.status='resolved';i.finalValue='需补充资料';i.reviewer='林运营';i.reviewedAt=now();i.basis='标记需补充资料';}
  else if(val){i.status='resolved';i.finalValue=val;i.reviewer='林运营';i.reviewedAt=now();i.basis='人工录入';}
  else {toast('请输入值或标记需补充资料','error');return;}
  saveDB();closeModal();toast('问题已处理','success');render();
}

    </div>
    <div class="card">
      <div class="card-h"><h3>版本对比</h3></div>
      <div class="card-b">
        <p class="small muted mb">选择两个版本进行差异对比（模拟）。</p>
        <div class="field"><label>商品</label><select class="input" id="vcProd" onchange="fillVersionSelects()">${DB.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')}</select></div>
        <div class="row"><div class="field"><label>版本 A</label><select class="input" id="vcA">${versionOptions(DB.products[0]?DB.products[0].id:'')}</select></div><div class="field"><label>版本 B</label><select class="input" id="vcB">${versionOptions(DB.products[0]?DB.products[0].id:'')}</select></div></div>
        <button class="btn btn-primary" style="width:100%" onclick="runVersionCompare()">${ic('eye')}对比版本</button>
      </div>
    </div>
  </div>`;
}
function runVersionCompare(){
  const p=productById(document.getElementById('vcProd').value);
  if(!p||p.versions.length<1){toast('该商品暂无版本','error');return;}
  const a=parseInt(document.getElementById('vcA').value);const b=parseInt(document.getElementById('vcB').value);
  const va=p.versions.find(x=>x.v===a);const vb=p.versions.find(x=>x.v===b);
  if(!va||!vb){toast('请选择要对比的两个版本','error');return;}
  const fieldsA=va.changes.reduce((m,c)=>m.set(c.f,c.after),new Map());
  const fieldsB=vb.changes.reduce((m,c)=>m.set(c.f,c.after),new Map());
  const keys=new Set([...fieldsA.keys(),...fieldsB.keys()]);
  openModal(`<div class="modal-h"><h3>版本对比 V${a} → V${b}</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b"><table class="diff-table"><thead><tr><th>字段</th><th>V${a}</th><th>V${b}</th></tr></thead><tbody>
    ${[...keys].map(k=>{const x=fieldsA.get(k)||'—';const y=fieldsB.get(k)||'—';const diff=x!==y;return '<tr><td class="bold">'+esc(k)+'</td><td class="'+(diff?'del':'')+'">'+esc(x)+'</td><td class="'+(diff?'add':'')+'">'+esc(y)+'</td></tr>';}).join('')}
    </tbody></table></div>
    <div class="modal-f"><button class="btn btn-primary" onclick="closeModal()">关闭</button></div>`);
}
function versionOptions(productId){
  const p=productById(productId);if(!p||!p.versions.length)return '<option value="">无版本</option>';
  return p.versions.map(v=>'<option value="'+v.v+'">V'+v.v+' · '+esc(v.note)+'</option>').join('');
}
function fillVersionSelects(){
  const pid=document.getElementById('vcProd').value;
  document.getElementById('vcA').innerHTML=versionOptions(pid);
  const b=document.getElementById('vcB');b.innerHTML=versionOptions(pid);
  const p=productById(pid);if(p&&p.versions.length>1){const opts=b.querySelectorAll('option');opts[opts.length-1].selected=true;}
}

    <div class="field"><label>品牌风格描述</label><textarea class="input" placeholder="例如：温暖、治愈、低饱和、注重材质细节" oninput="planWizard.styleDesc=this.value">${esc(planWizard.styleDesc)}</textarea></div>
    <div class="dropzone" onclick="document.getElementById('pwRef').click()">${ic('upload',30)}<div class="bold">上传参考图片（可选）</div><div class="small muted">原型仅模拟，不真实上传</div><input type="file" id="pwRef" accept="image/*" style="display:none" onchange="planWizard.refImg=this.files[0]?this.files[0].name:null;renderPlanWizard()"></div>
    ${planWizard.refImg?'<div class="small mt">'+ic('image',14)+' 参考图：'+esc(planWizard.refImg)+'</div>':''}`;}
  else if(planWizard.step===8){
    const p=productById(planWizard.productId);

      <tr><th>营销渠道</th><td>${esc(planWizard.channel||'—')}</td></tr>

      <button class="btn btn-secondary" onclick="closeModal()">取消</button>

function createPlan(){
  const p=productById(planWizard.productId);
  const plan=generateMockPlan(p,planWizard);
  DB.plans.unshift(plan);
  saveDB();closeModal();toast('策划任务已创建，AI 开始理解商品…','success');
  go('plans/'+plan.id+'/insight');
}

        <div class="top">
          <span class="grip">${ic('more')}</span>
          <div style="flex:1"><h4>${esc(s.point)}</h4><div class="basis">依据：${esc(s.basis)}</div></div>

function reAnalyze(id){toast('AI 正在重新分析（模拟）…','info');setTimeout(()=>{toast('卖点已更新','success');},900);}
function addSellingPoint(id){
  openModal(`<div class="modal-h"><h3>补充卖点</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b"><div class="field"><label>卖点内容</label><input class="input" id="spPoint" placeholder="输入卖点"></div>
    <div class="field"><label>依据</label><input class="input" id="spBasis" placeholder="说明依据"></div>
    <div class="field"><label>类型</label><select class="input" id="spType"><option value="fact">事实卖点</option><option value="derived">创意推导</option><option value="unverified">待核实</option></select></div></div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveSellingPoint('${id}')">添加</button></div>`);
}
function saveSellingPoint(id){
  const plan=planById(id);const point=document.getElementById('spPoint').value.trim();if(!point){toast('请输入卖点','error');return;}
  plan.insights.push({point,basis:document.getElementById('spBasis').value||'人工补充',type:document.getElementById('spType').value});
  saveDB();closeModal();toast('卖点已添加','success');render();
}
function deleteSellingPoint(id,i){const p=planById(id);p.insights.splice(i,1);saveDB();render();}
function moveSellingPoint(id,i,d){const p=planById(id);const j=i+d;if(j<0||j>=p.insights.length)return;const t=p.insights[i];p.insights[i]=p.insights[j];p.insights[j]=t;saveDB();render();}

      <div class="iv" style="background:linear-gradient(135deg,${p.color},${shade(p.color)})"><span class="num">#${im.no}</span>${ic(p.icon,32)}</div>
      <div class="ib"><h4>${esc(im.theme)}</h4><p>${esc(im.use)} · ${esc(im.focus)}</p>
        <div class="spec"><span>${esc(im.comp)}</span><span>${esc(im.scene)}</span><span>${esc(im.light)}</span><span>${esc(im.ratio)}</span></div></div>
      <div class="if">
        <button class="btn btn-soft btn-sm" style="flex:1" onclick="editImage('${plan.id}','${im.id}')">${ic('edit')}编辑</button>
        <button class="btn btn-ghost btn-sm" ${i===0?'disabled':''} onclick="moveImage('${plan.id}',${i},-1)">${ic('up')}</button>
        <button class="btn btn-ghost btn-sm" ${i===plan.images.length-1?'disabled':''} onclick="moveImage('${plan.id}',${i},1)">${ic('down')}</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteImage('${plan.id}',${i})">${ic('trash')}</button>
      </div>
    </div>`).join('')||'<div class="empty" style="grid-column:1/-1"><div class="art">'+ic('image',30)+'</div><h4>暂无图片策划</h4><p>新增图片或重新生成。</p><div class="actions"><button class="btn btn-primary btn-sm" onclick="addImage(\''+plan.id+'\')">新增图片</button></div></div>'}</div>`;
}
function addImage(id){
  const p=planById(id);const no=p.images.length+1;
  p.images.push({id:uid('i'),no,use:'新图片',theme:'新图片主题',focus:'商品展示',comp:'居中构图',scene:'纯色背景',light:'柔光',color:'自然',ratio:'1:1',copy:'',gen:''});
  saveDB();render();toast('已新增图片 #'+no,'success');
}
function editImage(id,iid){
  const p=planById(id);const im=p.images.find(x=>x.id===iid);if(!im)return;
  openModal(`<div class="modal-h"><h3>编辑图片 #${im.no}</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b">
      <div class="row"><div class="field"><label>图片用途</label><input class="input" id="eiUse" value="${esc(im.use)}"></div><div class="field"><label>图片主题</label><input class="input" id="eiTheme" value="${esc(im.theme)}"></div></div>
      <div class="field"><label>商品展示重点</label><input class="input" id="eiFocus" value="${esc(im.focus)}"></div>
      <div class="row"><div class="field"><label>画面构图</label><input class="input" id="eiComp" value="${esc(im.comp)}"></div><div class="field"><label>背景场景</label><input class="input" id="eiScene" value="${esc(im.scene)}"></div></div>
      <div class="row"><div class="field"><label>光线设计</label><input class="input" id="eiLight" value="${esc(im.light)}"></div><div class="field"><label>色彩风格</label><input class="input" id="eiColor" value="${esc(im.color)}"></div></div>
      <div class="row"><div class="field"><label>画面比例</label><input class="input" id="eiRatio" value="${esc(im.ratio)}"></div><div class="field"><label>文案建议</label><input class="input" id="eiCopy" value="${esc(im.copy)}"></div></div>
      <div class="field"><label>图片生成描述</label><textarea class="input" id="eiGen">${esc(im.gen)}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="regenImage('${id}','${iid}')">${ic('refresh')}重新生成</button><button class="btn btn-primary" onclick="saveImage('${id}','${iid}')">保存</button></div>`);
}
function saveImage(id,iid){
  const p=planById(id);const im=p.images.find(x=>x.id===iid);
  ['use','theme','focus','comp','scene','light','color','ratio','copy','gen'].forEach(k=>{const v=document.getElementById('ei'+k.charAt(0).toUpperCase()+k.slice(1));if(v)im[k]=v.value;});
  saveDB();closeModal();toast('图片策划已更新','success');render();
}
function regenImage(id,iid){toast('正在重新生成该图片策划（模拟）…','info');}
function deleteImage(id,i){const p=planById(id);p.images.splice(i,1);p.images.forEach((im,j)=>im.no=j+1);saveDB();render();}
function moveImage(id,i,d){const p=planById(id);const j=i+d;if(j<0||j>=p.images.length)return;const t=p.images[i];p.images[i]=p.images[j];p.images[j]=t;p.images.forEach((im,k)=>im.no=k+1);saveDB();render();}

/* ---- 视频脚本与分镜 ---- */
function pagePlanVideo(){
  const plan=currentPlan();if(!plan)return emptyState('未选择策划任务','请从策划任务列表进入。',"go('plans/list')",'返回任务列表');
  const total=(plan.shots||[]).reduce((s,x)=>s+x.dur,0);
  return planStageNav(plan)+`
  <div class="page-head"><div class="row"><div><div class="h1">视频脚本与分镜</div><div class="desc">根据商品与营销策略生成可执行的视频内容方案。每个镜头独立编辑，镜头时长与总时长保持一致。</div></div>
    <div class="actions"><button class="btn btn-primary" onclick="addShot('${plan.id}')">${ic('plus')}新增镜头</button></div></div></div>
  <div class="video-meta">
    <div class="vm"><div class="l">视频主题</div><div class="v">${esc(plan.name)}</div></div>
    <div class="vm"><div class="l">视频时长</div><div class="v">${total}s</div></div>
    <div class="vm"><div class="l">视频比例</div><div class="v">9:16</div></div>
    <div class="vm"><div class="l">视频渠道</div><div class="v">${esc(plan.channel||'—')}</div></div>
    <div class="vm"><div class="l">视频风格</div><div class="v">${esc(plan.style||'—')}</div></div>
  </div>
  ${plan.shots.length?`<div class="timeline">${plan.shots.map(s=>{const pct=(s.dur/total*100).toFixed(1);return '<div class="seg" style="width:'+pct+'%;background:'+s.color+'" title="#'+s.no+' '+s.scene+' · '+s.dur+'s">#'+s.no+'</div>';}).join('')}</div>`:''}
  <div class="card"><div class="card-h"><h3>分镜列表</h3><span class="sub">${plan.shots.length} 个镜头 · 总时长 ${total}s</span></div><div class="card-b">
    ${plan.shots.map((s,i)=>`
    <div class="shot">
      <div class="shot-h"><span class="idx">${s.no}</span><span class="dur">${s.dur}s</span><b>${esc(s.scene)}</b><span class="spacer"></span>
        <button class="btn btn-ghost btn-xs" ${i===0?'disabled':''} onclick="moveShot('${plan.id}',${i},-1)">${ic('up')}</button>
        <button class="btn btn-ghost btn-xs" ${i===plan.shots.length-1?'disabled':''} onclick="moveShot('${plan.id}',${i},1)">${ic('down')}</button>
        <button class="btn btn-soft btn-xs" onclick="editShot('${plan.id}','${s.id}')">${ic('edit')}编辑</button>
        <button class="btn btn-ghost btn-xs" onclick="deleteShot('${plan.id}',${i})">${ic('trash')}</button>
      </div>
      <div class="shot-b">
        <div class="col">
          <div class="kv"><b>画面内容</b>${esc(s.scene)}</div>
          <div class="kv"><b>景别 / 运镜</b>${esc(s.scale)} · ${esc(s.move)}</div>
          <div class="kv"><b>商品展示重点</b>${esc(s.focus)}</div>
        </div>
        <div class="col">
          <div class="kv"><b>旁白</b>${esc(s.vo)}</div>
          <div class="kv"><b>字幕</b>${esc(s.sub)}</div>
          <div class="kv"><b>转场</b>${esc(s.trans)}</div>
        </div>
      </div>
    </div>`).join('')||'<div class="empty"><div class="art">'+ic('video',30)+'</div><h4>暂无分镜</h4><p>新增镜头以构建视频脚本。</p><div class="actions"><button class="btn btn-primary btn-sm" onclick="addShot(\''+plan.id+'\')">新增镜头</button></div></div>'}
  </div></div>`;
}
function addShot(id){const p=planById(id);const no=p.shots.length+1;p.shots.push({id:uid('s'),no,dur:2,scene:'新镜头',scale:'中景',move:'固定',focus:'商品展示',vo:'旁白内容',sub:'字幕',trans:'切',color:'#5a5fd6'});saveDB();render();toast('已新增镜头 #'+no,'success');}
function editShot(id,sid){
  const p=planById(id);const s=p.shots.find(x=>x.id===sid);if(!s)return;
  openModal(`<div class="modal-h"><h3>编辑镜头 #${s.no}</h3><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-b">
      <div class="row"><div class="field"><label>镜头时长（秒）</label><input class="input" type="number" id="esDur" value="${s.dur}" min="1" max="60"></div><div class="field"><label>画面内容</label><input class="input" id="esScene" value="${esc(s.scene)}"></div></div>
      <div class="row"><div class="field"><label>景别</label><select class="input" id="esScale"><option>特写</option><option>近景</option><option>中景</option><option>全景</option></select></div><div class="field"><label>运镜方式</label><select class="input" id="esMove"><option>推</option><option>拉</option><option>摇</option><option>移</option><option>固定</option></select></div></div>
      <div class="field"><label>商品展示重点</label><input class="input" id="esFocus" value="${esc(s.focus)}"></div>
      <div class="field"><label>旁白</label><textarea class="input" id="esVo">${esc(s.vo)}</textarea></div>
      <div class="row"><div class="field"><label>字幕</label><input class="input" id="esSub" value="${esc(s.sub)}"></div><div class="field"><label>转场</label><input class="input" id="esTrans" value="${esc(s.trans)}"></div></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="toast('正在重新生成该镜头（模拟）…','info')">${ic('refresh')}重新生成</button><button class="btn btn-primary" onclick="saveShot('${id}','${sid}')">保存</button></div>`);
  document.getElementById('esScale').value=s.scale;document.getElementById('esMove').value=s.move;
}
function saveShot(id,sid){
  const p=planById(id);const s=p.shots.find(x=>x.id===sid);
  s.dur=parseInt(document.getElementById('esDur').value)||2;
  s.scene=document.getElementById('esScene').value;s.scale=document.getElementById('esScale').value;s.move=document.getElementById('esMove').value;
  s.focus=document.getElementById('esFocus').value;s.vo=document.getElementById('esVo').value;s.sub=document.getElementById('esSub').value;s.trans=document.getElementById('esTrans').value;
  saveDB();closeModal();toast('镜头已更新','success');render();
}
function deleteShot(id,i){const p=planById(id);p.shots.splice(i,1);p.shots.forEach((s,j)=>s.no=j+1);saveDB();render();}
function moveShot(id,i,d){const p=planById(id);const j=i+d;if(j<0||j>=p.shots.length)return;const t=p.shots[i];p.shots[i]=p.shots[j];p.shots[j]=t;p.shots.forEach((s,k)=>s.no=k+1);saveDB();render();}

/* ---- 策划审核与版本管理 ---- */
function pagePlanReview(){
  const plan=currentPlan();if(!plan)return emptyState('未选择策划任务','请从策划任务列表进入。',"go('plans/list')",'返回任务列表');
  const p=productById(plan.productId);
  const linkage=versionLinkage(plan);
  return planStageNav(plan)+`
  <div class="page-head"><div class="row"><div><div class="h1">策划审核与版本管理</div><div class="desc">对最终策划方案进行审核、确认与版本管理。商品档案版本变化时联动提示，不自动覆盖已确认策划。</div></div>
    <div class="actions"><button class="btn btn-ghost" onclick="demoVersionBump('${plan.productId}')">${ic('workflow')}模拟商品升级</button><button class="btn btn-secondary" onclick="exportPlan('${plan.id}')">${ic('download')}导出</button><button class="btn btn-primary" onclick="confirmPlan('${plan.id}')">${ic('check')}确认策划</button></div></div></div>
  ${linkage?`<div class="alert warn">${ic('alert')}<div><b>商品档案已升级：V${linkage.ref} → V${linkage.cur}</b><br><span>该策划引用了商品档案 V${linkage.ref}，以下字段已变化，可能需要重新审核：</span><br>${linkage.changedFields.map(c=>'<span class="tag orange" style="margin:2px 2px 0 0">'+esc(c.f)+'：'+esc(c.after)+'</span>').join('')}</div><div><button class="btn btn-soft btn-sm" onclick="updatePlanProductVersion('${plan.id}')">${ic('refresh')}更新策划并生成新版本</button></div></div>`:''}
  <div class="grid-2-1">
    <div class="card"><div class="card-h"><h3>策划内容摘要</h3><span class="sub">引用商品档案 V${plan.productVersion}</span></div><div class="card-b">
      ${[['商品信息版本','V'+plan.productVersion],['营销场景',plan.scene],['营销策略',plan.strategy?(plan.strategy.direction||plan.strategy.goal):'—'],['创意方案',plan.concepts.filter(c=>c.selected).map(c=>c.name).join('、')||plan.concepts[0]?.name||'—'],['图片策划',plan.images.length+' 张'],['视频分镜',plan.shots.length+' 个镜头 · '+(plan.shots||[]).reduce((s,x)=>s+x.dur,0)+'s'],['商品事实引用',plan.insights.filter(s=>s.type==='fact').length+' 个事实卖点']].map(x=>'<div class="av" style="display:flex;gap:14px;border-bottom:1px dashed var(--line-2);padding:9px 0"><span class="bold" style="min-width:110px;color:var(--text-2)">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>').join('')}
    </div></div>
    <div class="card"><div class="card-h"><h3>待审核检查</h3></div><div class="card-b">
      ${[['事实卖点均有档案依据',plan.insights.filter(s=>s.type==='fact').length>0],['无无依据宣传词','通过'],['图片遵守商品事实约束','通过'],['视频镜头时长一致',true],['引用商品档案版本',true]].map(x=>'<div class="av" style="display:flex;justify-content:space-between;border-bottom:1px dashed var(--line-2);padding:9px 0"><span>'+x[0]+'</span>'+ic('checkCircle',16)+'</div>').join('')}
    </div></div>
  </div>
  <div class="card mt"><div class="card-h"><h3>策划版本</h3><span class="sub">${plan.versions.length} 个版本</span></div><div class="card-b" style="padding-top:0">
    ${plan.versions.length?plan.versions.slice().reverse().map(v=>`<div class="file" style="margin-top:12px"><span class="fic">${ic('archive')}</span><div class="meta"><b>V${v.v} · ${esc(v.note)}</b><span>${fmtTime(v.time)} · ${esc(v.by)} · 商品档案 V${v.productVersion} · ${esc(v.changes)}</span></div>${statusTag(v.status==='已确认'?'confirmed':v.status==='待审核'?'pending':'draft',v.status)}</div>`).join(''):'<div class="small muted" style="padding:12px 0">暂无版本，确认策划后生成首个版本。</div>'}
  </div></div>`;
}
function versionLinkage(plan){
  const p=productById(plan.productId);if(!p)return null;
  const ref=plan.productVersion||1;const cur=p.currentVersion;
  if(cur<=ref)return null;
  const changedFields=[];
  p.versions.filter(v=>v.v>ref).forEach(v=>v.changes.forEach(c=>{if(c.f!=='数据状态'&&c.f!=='商品名称')changedFields.push(c);}));
  return {ref,cur,changedFields:changedFields.slice(0,8)};
}
function demoVersionBump(productId){
  const p=productById(productId);if(!p)return;
  p.currentVersion+=1;
  const v=p.currentVersion;
  p.status='confirmed';p.statusNote='已确认';
  p.versions.push({v,time:now(),by:'供应商更新（演示）',note:'演示：商品颜色与包装变更',status:'已发布',changes:[{f:'商品颜色',before:'暖米白',after:'暖米白 / 燕麦色',reason:'演示联动'},{f:'包装规格',before:'单个独立防尘袋',after:'礼盒装 + 防尘袋',reason:'演示联动'}]});
  saveDB();toast('商品档案已升级到 V'+v+'（演示版本联动）','success');render();
}
function updatePlanProductVersion(id){
  const plan=planById(id);const p=productById(plan.productId);
  const old=plan.productVersion;
  plan.productVersion=p.currentVersion;
  plan.versions.push({v:plan.versions.length+1,time:now(),by:'林运营',productVersion:p.currentVersion,note:'商品档案升级联动更新',changes:'更新引用商品版本 V'+old+' → V'+p.currentVersion,status:'待审核'});
  plan.status='review';plan.stage='待人工审核';plan.updatedAt=now();
  saveDB();toast('已更新策划并生成新版本','success');render();
}
function confirmPlan(id){
  const plan=planById(id);
  if(versionLinkage(plan)){toast('存在商品档案版本变化，请先更新策划','error');return;}
  const v=plan.versions.length+1;
  plan.status='confirmed';plan.stage='已确认';
  plan.versions.push({v,time:now(),by:'林运营',productVersion:plan.productVersion,note:'确认策划',changes:'人工确认发布',status:'已确认'});
  saveDB();toast('策划已确认，生成版本 V'+v,'success');render();
}
function exportPlan(id){
  const plan=planById(id);
  const blob=new Blob([JSON.stringify(plan,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=plan.id+'-策划导出.json';a.click();URL.revokeObjectURL(a.href);
  toast('已导出策划（模拟 JSON）','success');
}

/* ================= 空状态 ================= */
function emptyState(title,desc,on,btnText){
  return `<div class="empty" style="padding:80px 20px"><div class="art">${ic('box',30)}</div><h4>${esc(title)}</h4><p>${esc(desc)}</p><div class="actions"><button class="btn btn-primary" onclick="${on}">${btnText||'返回'}</button></div></div>`;
}

window.addEventListener('hashchange',render);
render();
</script>
</body>
